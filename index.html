        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl animate-in fade-in duration-200" onClick={onClose}>
          <div className="bg-[#0a0a0a] w-full max-w-lg rounded-2xl border border-white/10 shadow-[0_0_40px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col max-h-[85vh]" onClick={(e) => e.stopPropagation()}>
            <div className="p-6 border-b border-white/5 flex justify-between items-start bg-gradient-to-br from-white/5 to-transparent">
              <div>
                <span className="text-[10px] font-black uppercase tracking-widest mb-1 block text-gray-400">Word</span>
                <h2 className="font-black uppercase tracking-tighter text-white whitespace-nowrap leading-none pr-2 drop-shadow-md" style={{ fontSize: getModalFontSize(word) }}>{word}</h2>
              </div>
              <button onClick={onClose} className="w-10 h-10 shrink-0 bg-white/5 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/20 transition-all border border-white/10">✕</button>
            </div>
            <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
              {isLoading ? (
                <div className="flex justify-center py-16"><div className="w-12 h-12 border-4 border-white/20 border-t-transparent rounded-full animate-spin"></div></div>
              ) : (
                <div className="space-y-6">
                  <div className="bg-white/5 p-4 rounded-xl border border-white/5">
                      <h3 className="text-green-400 text-[10px] font-black uppercase tracking-widest mb-2 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-green-400"></span> {dictData?.rhymeLabel || 'Top Rhymes'}</h3>
                      <p className="text-white font-bold text-base md:text-lg leading-relaxed">{dictData?.rhymes?.length > 0 ? dictData.rhymes.join(', ') : 'No rhymes found'}</p>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                      <div className="bg-white/5 p-4 rounded-xl border border-white/5">
                          <h3 className="text-blue-400 text-[10px] font-black uppercase tracking-widest mb-2">Synonyms</h3>
                          <p className="text-gray-300 text-sm leading-relaxed">{dictData?.synonyms?.length > 0 ? dictData.synonyms.slice(0, 8).join(', ') : 'None'}</p>
                      </div>
                      <div className="bg-white/5 p-4 rounded-xl border border-white/5">
                          <h3 className="text-red-400 text-[10px] font-black uppercase tracking-widest mb-2">Antonyms</h3>
                          <p className="text-gray-300 text-sm leading-relaxed">{dictData?.antonyms?.length > 0 ? dictData.antonyms.slice(0, 6).join(', ') : 'None'}</p>
                      </div>
                  </div>
                  <div className="pt-4 border-t border-white/10">
                      <h3 className="text-gray-500 text-[10px] font-black uppercase tracking-widest mb-4">Definition</h3>
                      <div className="space-y-3">
                        {dictData?.definitions?.map((def, idx) => (
                          <div key={idx} className="text-gray-400 text-sm md:text-base leading-relaxed pl-3 border-l-2 border-gray-700">
                            {def.pos && <span className="text-gray-600 italic text-xs mr-2">{def.pos}.</span>}
                            {def.text.replace(/\(heading\)\s*/gi, '')}
                          </div>
                        ))}
                      </div>
                  </div>
                  <div className="pt-4 text-center">
                      <button onClick={onClose} className="text-gray-300 text-xs font-black uppercase tracking-widest bg-white/10 hover:bg-white/20 py-4 px-8 rounded-full transition-all w-full active:scale-95 border border-white/10">{isVaultMode ? 'Close' : 'Resume Session'}</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // --- VAULT ITEM SUB-COMPONENT ---
    const VaultItem = ({ item, onDetails, onToggle }) => {
      const [isGhost, setIsGhost] = useState(false);
      
      const handleRemoval = () => {
        setIsGhost(true);
        setTimeout(() => onToggle(item.word), 600);
      };

      return (
        <div className={`flex justify-between items-center bg-[#0f0f0f] border border-white/5 px-5 py-4 rounded-xl transition-all ${isGhost ? 'opacity-30 scale-95 blur-sm' : 'opacity-100 hover:bg-[#151515]'}`}>
          <button onClick={() => onDetails(item.word)} className="flex-1 text-left flex flex-col group">
            <span className="text-lg font-black text-gray-200 uppercase tracking-tight group-hover:text-white transition-colors">{item.word}</span>
            <span className="text-[9px] text-gray-600 font-bold uppercase mt-1">Forged on {new Date(item.addedAt).toLocaleDateString()}</span>
          </button>
          <button 
            onClick={handleRemoval} 
            className="text-2xl text-yellow-500 hover:scale-110 active:scale-90 transition-transform"
          >★</button>
        </div>
      );
    };

    // --- MAIN APP ---
    function App() {
      // --- STATES ---
      const [showSplash, setShowSplash] = useState(true);
      const [appState, setAppState] = useState('idle');
      const [currentWords, setCurrentWords] = useState(['TAP START']);
      const [wordCount, setWordCount] = useState(1);
      const [isPausedForDict, setIsPausedForDict] = useState(false);
      const [activeDictWord, setActiveDictWord] = useState(null);
      
      const [selectedTier, setSelectedTier] = useState(1);
      const [intervalMs, setIntervalMs] = useState(3500); 
      const [beatAudioSrc, setBeatAudioSrc] = useState(null);
      const [beatFileName, setBeatFileName] = useState('');
      const [isMetronomeOn, setIsMetronomeOn] = useState(false);
      const [showInfo, setShowInfo] = useState(false);
      
      const timerRef = useRef(null);
      const metronomeRef = useRef(null);
      const audioPlayerRef = useRef(null);
      const audioCtxRef = useRef(null);
      const fileInputRef = useRef(null);
      const lastWordRef = useRef(null); 
      const fetchAbortControllerRef = useRef(null);
      const dictCacheRef = useRef({});
      const wakeLockRef = useRef(null);
      
      const [sessionStartTime, setSessionStartTime] = useState(null);
      const [totalWordsSeen, setTotalWordsSeen] = useState(0);
      const [frozenWords, setFrozenWords] = useState(new Set());
      const [sessionDuration, setSessionDuration] = useState(0);

      const [vault, setVault] = useState(() => {
        if (typeof window === 'undefined') return [];
        try {
          const saved = window.localStorage.getItem('barsmithVault') || window.localStorage.getItem('flowForgeVault');
          if (saved) {
            const parsed = JSON.parse(saved);
            return parsed.map(item => typeof item === 'string' ? { word: item, addedAt: Date.now() } : { word: item.word, addedAt: item.addedAt || Date.now() });
          }
        } catch (e) { console.error(e); }
        return [];
      });
      const [vaultSortMode, setVaultSortMode] = useState('Newest'); 

      const [dictData, setDictData] = useState(null);
      const [isLoadingDict, setIsLoadingDict] = useState(false);
      const [summaryActiveWord, setSummaryActiveWord] = useState(null);

      // --- HELPERS ---
      const getDynamicFontSize = (word, count) => {
        const len = Math.max(word.length || 1, 4); 
        const isLandscape = typeof window !== 'undefined' && window.innerWidth > window.innerHeight;
        if (!isLandscape) {
          if (count === 4) return `calc(min(11vw, ${50 / len}vw))`;
          if (count === 3) return `calc(min(14vw, ${65 / len}vw))`;
          if (count === 2) return `calc(min(18vw, ${90 / len}vw))`;
          return `calc(min(24vw, ${135 / len}vw))`;
        }
        if (count === 4) return `calc(min(8vh, ${45 / len}vw))`;
        if (count === 3) return `calc(min(10vh, ${60 / len}vw))`;
        if (count === 2) return `calc(min(12vh, ${80 / len}vw))`;
        return `calc(min(16vh, ${120 / len}vw))`;
      };

      const requestWakeLock = async () => {
        try {
          if ('wakeLock' in navigator) {
            wakeLockRef.current = await navigator.wakeLock.request('screen');
          }
        } catch (err) { console.log('Wake Lock denied:', err); }
      };

      const releaseWakeLock = () => {
        if (wakeLockRef.current !== null) {
          wakeLockRef.current.release().then(() => { wakeLockRef.current = null; });
        }
      };

      const getTierDistribution = (baseTier, count) => {
        const c = Number(count);
        const b = Number(baseTier);
        if (c === 1) return [b];
        const others = [1, 2, 3].filter(t => t !== b);
        if (c === 2) return [b, others[Math.floor(Math.random() * others.length)]];
        if (c === 3) return [1, 2, 3]; 
        if (c === 4) return [b, b, others[0], others[1]]; 
        return [b];
      };

      const getNextRandomWords = (count) => {
        const c = Number(count);
        const selected = [];
        const tierDist = getTierDistribution(selectedTier, c);
        tierDist.sort(() => Math.random() - 0.5);
        for (let i = 0; i < c; i++) {
          const bank = globalWordBanks[tierDist[i]];
          if (!bank || bank.length === 0) continue;
          let w; let attempts = 0;
          do {
            w = bank[Math.floor(Math.random() * bank.length)];
            attempts++;
          } while ((selected.includes(w) || lastWordRef.current?.includes(w)) && attempts < 15);
          if (w) selected.push(w);
        }
        lastWordRef.current = selected; return selected;
      };

      // --- HANDLERS ---
      const startSession = () => {
        if (audioCtxRef.current?.state === 'suspended') audioCtxRef.current.resume();
        if (beatAudioSrc && audioPlayerRef.current) { audioPlayerRef.current.currentTime = 0; audioPlayerRef.current.play().catch(console.error); }
        requestWakeLock();
        setSessionStartTime(Date.now()); 
        setTotalWordsSeen(Number(wordCount)); 
        setFrozenWords(new Set()); 
        setCurrentWords(getNextRandomWords(Number(wordCount))); 
        setAppState('active'); 
        setIsPausedForDict(false);
      };

      const stopSession = () => {
        if (audioPlayerRef.current) audioPlayerRef.current.pause();
        releaseWakeLock();
        setSessionDuration(Math.floor((Date.now() - sessionStartTime) / 1000)); 
        setAppState('summary'); 
        setIsPausedForDict(false);
      };

      const resetToIdle = () => { 
        setAppState('idle'); 
        setCurrentWords(['READY...']); 
        setSummaryActiveWord(null); 
        setDictData(null); 
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (beatAudioSrc) URL.revokeObjectURL(beatAudioSrc); 
          setBeatFileName(file.name); setBeatAudioSrc(URL.createObjectURL(file)); setIsMetronomeOn(false); 
        }
      };

      const removeBeat = () => {
        setBeatFileName(''); if (beatAudioSrc) URL.revokeObjectURL(beatAudioSrc); 
        setBeatAudioSrc(null); if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const playTick = () => {
        if (!audioCtxRef.current) return;
        if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
        const osc = audioCtxRef.current.createOscillator();
        const gainNode = audioCtxRef.current.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtxRef.current.destination);
        osc.frequency.setValueAtTime(800, audioCtxRef.current.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtxRef.current.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtxRef.current.currentTime + 0.1);
        osc.start(); osc.stop(audioCtxRef.current.currentTime + 0.1);
      };

      const fetchWithAbort = async (url, signal) => {
          try {
              const response = await fetch(url, { signal });
              if (!response.ok) return null;
              return await response.json();
          } catch (error) {
              if (error.name === 'AbortError') throw error;
              return null;
          }
      };

      const fetchDictionaryData = async (rawWord) => {
        const normalizedWord = rawWord.trim().toLowerCase();
        if (fetchAbortControllerRef.current) fetchAbortControllerRef.current.abort();
        if (dictCacheRef.current[normalizedWord]) { setDictData(dictCacheRef.current[normalizedWord]); setIsLoadingDict(false); return; }
        fetchAbortControllerRef.current = new AbortController();
        setIsLoadingDict(true); setDictData(null); 
        try {
          const [dictDataPayload, rhymeData, nearRhymeData, synData, antData, meansLikeData] = await Promise.all([
            fetchWithAbort(`https://api.dictionaryapi.dev/api/v2/entries/en/${normalizedWord}`, fetchAbortControllerRef.current.signal),
            fetchWithAbort(`https://api.datamuse.com/words?rel_rhy=${normalizedWord}`, fetchAbortControllerRef.current.signal), 
            fetchWithAbort(`https://api.datamuse.com/words?rel_nry=${normalizedWord}`, fetchAbortControllerRef.current.signal),
            fetchWithAbort(`https://api.datamuse.com/words?rel_syn=${normalizedWord}`, fetchAbortControllerRef.current.signal), 
            fetchWithAbort(`https://api.datamuse.com/words?rel_ant=${normalizedWord}`, fetchAbortControllerRef.current.signal),
            fetchWithAbort(`https://api.datamuse.com/words?ml=${normalizedWord}`, fetchAbortControllerRef.current.signal)
          ]);
          let foundDefs = []; let foundSynonyms = []; let foundAntonyms = [];
          if (dictDataPayload?.[0]?.meanings) {
            dictDataPayload[0].meanings.forEach(m => {
                if (m.definitions) m.definitions.slice(0, 2).forEach(d => foundDefs.push({ pos: m.partOfSpeech, text: d.definition }));
                if (m.synonyms) foundSynonyms.push(...m.synonyms); if (m.antonyms) foundAntonyms.push(...m.antonyms);
            });
          }
          const filterGarbage = (arr) => [...new Set(arr)].map(w => w.toLowerCase()).filter(w => /^[a-z]+$/.test(w) && w !== normalizedWord);
          if (synData) foundSynonyms.push(...synData.map(s => s.word));
          if (foundSynonyms.length === 0 && meansLikeData) foundSynonyms.push(...meansLikeData.map(s => s.word));
          if (antData) foundAntonyms.push(...antData.map(a => a.word));
          let foundRhymes = (rhymeData?.length > 0 ? rhymeData : nearRhymeData || []).map(r => r.word).filter(w => w.toLowerCase() !== normalizedWord).slice(0, 12);
          const finalData = { definitions: foundDefs.slice(0, 3), rhymes: foundRhymes, rhymeLabel: rhymeData?.length > 0 ? 'Top Rhymes' : 'Near Rhymes', synonyms: filterGarbage(foundSynonyms).slice(0, 12), antonyms: filterGarbage(foundAntonyms).slice(0, 10) };
          if (finalData.definitions.length === 0) finalData.definitions.push({ pos: '', text: 'Definition not found.' });
          dictCacheRef.current[normalizedWord] = finalData; setDictData(finalData);
        } catch (error) { 
          if (error.name === 'AbortError') return;
          setDictData({ definitions: [{text: 'Network error.'}], rhymes: [], synonyms: [], antonyms: [] }); 
        } finally { setIsLoadingDict(false); }
      };

      const pauseForDict = (word) => { 
        if (appState !== 'active' || isPausedForDict) return; 
        setIsPausedForDict(true); setActiveDictWord(word); setFrozenWords(prev => new Set(prev).add(word)); fetchDictionaryData(word); if (audioPlayerRef.current) audioPlayerRef.current.pause(); 
      };

      const resumeFromDict = () => { setIsPausedForDict(false); setActiveDictWord(null); setDictData(null); if (beatAudioSrc && audioPlayerRef.current) audioPlayerRef.current.play(); };
      
      const toggleVaultWord = (word) => { 
        setVault(prev => prev.some(w => w.word === word) ? prev.filter(w => w.word !== word) : [...prev, { word, addedAt: Date.now() }]); 
      };

      const isWordInVault = (word) => vault.some(w => w.word === word);

      const sortedVault = useMemo(() => {
        let res = [...vault];
        if (vaultSortMode === 'A-Z') res.sort((a,b) => a.word.localeCompare(b.word));
        else if (vaultSortMode === 'Z-A') res.sort((a,b) => b.word.localeCompare(a.word));
        else if (vaultSortMode === 'Oldest') res.sort((a,b) => a.addedAt - b.addedAt);
        else res.sort((a,b) => b.addedAt - a.addedAt);
        return res;
      }, [vault, vaultSortMode]);

      // --- EFFECTS ---
      useEffect(() => {
        const splashTimer = setTimeout(() => {
          setShowSplash(false);
          if (typeof window !== 'undefined') {
            const hasSeen = window.localStorage.getItem('barsmithHasSeenInfo');
            if (!hasSeen) {
              setShowInfo(true);
              window.localStorage.setItem('barsmithHasSeenInfo', 'true');
            }
          }
        }, 2500);
        return () => clearTimeout(splashTimer);
      }, []);

      useEffect(() => {
        if (typeof window !== 'undefined') window.localStorage.setItem('barsmithVault', JSON.stringify(vault));
      }, [vault]);

      useEffect(() => {
        if (appState === 'active' && !isPausedForDict) {
          timerRef.current = setInterval(() => {
            const nextWords = getNextRandomWords(Number(wordCount)); 
            setCurrentWords(nextWords); 
            setTotalWordsSeen(prev => prev + Number(wordCount));
          }, intervalMs);
          if (isMetronomeOn) {
            playTick(); metronomeRef.current = setInterval(playTick, intervalMs / 4);
          }
        } else {
          clearInterval(timerRef.current); clearInterval(metronomeRef.current);
        }
        return () => { clearInterval(timerRef.current); clearInterval(metronomeRef.current); }
      }, [appState, isPausedForDict, selectedTier, intervalMs, isMetronomeOn, wordCount]);

      useEffect(() => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtxRef.current = new AudioContext();
        return () => { if (audioCtxRef.current) audioCtxRef.current.close(); };
      }, []);

      // --- RENDER ---
      if (showSplash) {
        return (
          <div className="fixed inset-0 bg-[#050505] flex items-center justify-center z-[100] animate-out fade-out duration-1000 delay-[1.5s]">
            <div className="relative flex flex-col items-center animate-in zoom-in-95 duration-700 ease-out px-10">
              <div className="relative w-full max-w-[280px] aspect-square flex items-center justify-center">
                 <img src="icon-512.png" className="w-full h-full object-contain" />
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-[100dvh] w-full bg-[#050505] text-white flex flex-col font-sans select-none relative overflow-x-hidden animate-in fade-in duration-1000 safe-top safe-bottom">
          {beatAudioSrc && <audio ref={audioPlayerRef} src={beatAudioSrc} loop />}
          
          {appState === 'idle' && (
            <div className="flex-1 flex flex-col items-center w-full px-6 py-10 md:py-16 max-w-4xl mx-auto pb-32">
              <div className="flex justify-between w-full items-center mb-12">
                <div className="flex items-center gap-3">
                  <button onClick={() => setShowInfo(true)} className="w-8 h-8 rounded-full border border-white/20 text-white/50 text-xs font-bold hover:bg-white/10 hover:text-white transition-all flex items-center justify-center">?</button>
                  <h1 className="text-3xl md:text-5xl font-black tracking-tighter uppercase"><span className="text-white">BAR</span><span className="text-slate-500">SMITH</span></h1>
                </div>
                <button onClick={() => setAppState('vault')} className="bg-white/5 border border-white/10 px-5 py-2.5 rounded-full text-xs font-bold text-white hover:bg-white/10 flex items-center gap-2 backdrop-blur-md transition-all active:scale-95"><span className="text-yellow-500">★</span> Vault ({vault.length})</button>
              </div>
              {showInfo && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/90 backdrop-blur-md animate-in fade-in" onClick={() => setShowInfo(false)}>
                  <div className="bg-[#0f0f0f] border border-white/10 rounded-3xl p-8 max-w-md w-full shadow-2xl" onClick={e => e.stopPropagation()}>
                    <h3 className="text-2xl font-black uppercase tracking-tighter mb-4 border-b border-white/10 pb-4 text-white">How to Smith</h3>
                    <ul className="space-y-4 text-sm text-gray-300 font-medium">
                      <li><strong className="text-white">1. The Flow State:</strong> Words flash on screen. Keep your rhythm and build your bars around them.</li>
                      <li><strong className="text-white">2. Freezing:</strong> Tap a word to pause and see synonyms and rhymes.</li>
                      <li><strong className="text-white">3. Spacing:</strong> In multi-word mode, use the gap between words to bridge metaphoric leaps.</li>
                    </ul>
                    <button onClick={() => setShowInfo(false)} className="mt-8 w-full py-4 bg-white text-black font-black uppercase tracking-widest rounded-xl">Got it</button>
                  </div>
                </div>
              )}
              <div className="w-full space-y-8">
                <div className="bg-[#0f0f0f] border border-white/5 p-6 rounded-3xl">
                  <h2 className="text-[10px] text-gray-500 font-black uppercase tracking-widest mb-4">1. Environment</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {!beatFileName ? (
                      <button onClick={() => fileInputRef.current?.click()} className="w-full py-4 rounded-xl border border-dashed border-white/10 text-gray-400 text-sm font-bold hover:bg-white/5 transition-colors">+ Load Beat (MP3/WAV)</button>
                    ) : (
                      <div className="w-full py-4 px-5 rounded-xl bg-white/5 border border-white/10 text-white text-sm font-bold flex justify-between items-center"><span className="truncate pr-2 text-green-400">▶ {beatFileName}</span><button onClick={removeBeat} className="text-gray-500 hover:text-white transition-colors">✕</button></div>
                    )}
                    <input type="file" accept="audio/*" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                    <div className="flex items-center gap-3 bg-[#0a0a0a] border border-white/5 rounded-xl p-2 px-4">
                       <button onClick={() => { if(!beatAudioSrc) setIsMetronomeOn(!isMetronomeOn); }} className={`p-2 px-4 rounded-lg font-bold text-xs uppercase tracking-wider transition-all ${isMetronomeOn ? 'bg-white text-black' : 'bg-transparent text-gray-500 hover:text-white'}`} disabled={!!beatAudioSrc}>BPM {isMetronomeOn ? 'ON' : 'OFF'}</button>
                       <div className="flex-1 h-8 flex items-center"><input type="range" min="1" max="10" step="0.5" value={intervalMs / 1000} onChange={(e) => setIntervalMs(parseFloat(e.target.value) * 1000)} className="w-full appearance-none bg-transparent" /></div>
                       <span className="text-xs font-bold text-white w-8 text-right">{(intervalMs / 1000).toFixed(1)}s</span>
                    </div>
                  </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div><h2 className="text-[10px] text-gray-500 font-black uppercase tracking-widest mb-4 pl-2">2. Base Complexity</h2><div className="flex gap-3">{[1, 2, 3].map((t) => (<button key={t} onClick={() => setSelectedTier(t)} className={`flex-1 py-4 rounded-2xl font-black text-sm transition-all border ${selectedTier === t ? 'bg-white border-white text-black' : 'bg-[#0f0f0f] border-white/5 text-gray-600'}`}>Lvl {t}</button>))}</div></div>
                  <div><h2 className="text-[10px] text-gray-500 font-black uppercase tracking-widest mb-4 pl-2">3. Focus Mode</h2><div className="flex gap-2">{[1, 2, 3, 4].map(num => (<button key={num} onClick={() => setWordCount(Number(num))} className={`flex-1 py-4 rounded-2xl font-black text-sm transition-all border ${Number(wordCount) === num ? 'bg-white border-white text-black' : 'bg-[#0f0f0f] border-white/5 text-gray-600'}`}>{num}</button>))}</div></div>
                </div>
              </div>
            </div>
          )}

          {appState === 'active' && (
            <div className="flex-1 flex flex-col justify-center items-center px-6 py-12 relative overflow-hidden">
              {!isPausedForDict && (<div className="absolute top-0 left-0 w-full h-1.5 bg-white/5"><div key={totalWordsSeen} className="h-full bg-white shadow-[0_0_15px_rgba(255,255,255,0.8)]" style={{ animation: `shrinkBar ${intervalMs / 1000}s linear forwards` }} /></div>)}
              
              <div className={`relative w-full h-full flex flex-col justify-center items-center z-10 transition-all duration-500 
                ${currentWords.length > 2 ? 'gap-10 sm:gap-16' : 'gap-16 sm:gap-24'} 
                landscape:grid landscape:grid-cols-2 landscape:gap-x-12 landscape:gap-y-8 landscape:place-content-center`}>
                
                {currentWords.map((word, idx) => (
                  <h2 
                      key={`${totalWordsSeen}-${idx}`}
                      onClick={(e) => { e.stopPropagation(); pauseForDict(word); }} 
                      className={`font-black text-center uppercase tracking-tighter transition duration-300 ease-out cursor-pointer active:scale-90 ${isPausedForDict && activeDictWord !== word ? 'opacity-10 scale-[0.8] blur-sm pointer-events-none' : 'opacity-100 scale-100 text-white'}`} 
                      style={{ fontSize: getDynamicFontSize(word, currentWords.length), lineHeight: '1' }}
                  >
                    <span className="block animate-word-strike drop-shadow-2xl whitespace-nowrap">{word}</span>
                  </h2>
                ))}
              </div>
              
              {!isPausedForDict && <p className="absolute bottom-24 text-gray-600 text-[10px] font-black uppercase tracking-widest animate-pulse z-10 landscape:bottom-16">Tap a word to freeze</p>}
              {isPausedForDict && activeDictWord && <DictionaryModal word={activeDictWord} dictData={dictData} isLoading={isLoadingDict} onClose={resumeFromDict} />}
            </div>
          )}

          {appState === 'summary' && (
            <div className="flex-1 flex flex-col items-center p-6 overflow-y-auto custom-scrollbar pb-32">
              <div className="w-full mt-6 max-w-2xl">
                <div className="text-center mb-10"><h2 className="text-3xl md:text-5xl font-black text-white tracking-tighter uppercase text-center">Recap</h2></div>
                <div className="grid grid-cols-3 gap-3 mb-8">
                  <div className="bg-[#0f0f0f] border border-white/5 py-6 rounded-2xl text-center"><p className="text-gray-500 text-[10px] font-black uppercase tracking-widest mb-1">Time</p><p className="text-2xl md:text-3xl font-black text-white">{Math.floor(sessionDuration / 60)}:{String(sessionDuration % 60).padStart(2, '0')}</p></div>
                  <div className="bg-[#0f0f0f] border border-white/5 py-6 rounded-2xl text-center"><p className="text-gray-500 text-[10px] font-black uppercase tracking-widest mb-1">Words</p><p className="text-2xl md:text-3xl font-black text-white">{totalWordsSeen}</p></div>
                  <div className="bg-[#0f0f0f] border border-white/5 py-6 rounded-2xl text-center"><p className="text-gray-500 text-[10px] font-black uppercase tracking-widest mb-1">Pace</p><p className="text-xl md:text-2xl font-black text-gray-300 mt-1">{(intervalMs/1000).toFixed(1)}s</p></div>
                </div>
                <div className="bg-[#0f0f0f] p-6 rounded-3xl border border-white/5">
                  <div className="flex justify-between items-center mb-6 border-b border-white/5 pb-4"><h3 className="text-gray-400 text-xs font-black uppercase tracking-widest">Saved concepts</h3><span className="bg-white/10 px-3 py-1 rounded-full text-white text-xs font-bold">{frozenWords.size}</span></div>
                  {[...frozenWords].map((word) => {
                    const saved = isWordInVault(word);
                    return (
                      <div key={word} className="flex justify-between items-center bg-[#151515] px-5 py-4 rounded-xl mb-2 group transition-all">
                        <button onClick={() => { setSummaryActiveWord(word); fetchDictionaryData(word); }} className="text-base sm:text-lg font-black text-gray-300 flex-1 text-left uppercase group-hover:text-white transition-colors">{word}</button>
                        <button onClick={() => toggleVaultWord(word)} className={`text-2xl transition-all ${saved ? 'text-yellow-500' : 'text-gray-700'}`}>{saved ? '★' : '☆'}</button>
                      </div>
                    );
                  })}
                </div>
              </div>
              {summaryActiveWord && <DictionaryModal word={summaryActiveWord} dictData={dictData} isLoading={isLoadingDict} onClose={() => setSummaryActiveWord(null)} />}
            </div>
          )}

          {appState === 'vault' && (
            <div className="flex-1 flex flex-col items-center p-6 overflow-y-auto w-full custom-scrollbar pb-32">
               <div className="w-full mt-6 max-w-2xl">
                 <div className="flex items-center gap-4 mb-10"><button onClick={resetToIdle} className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center border border-white/5">←</button><h2 className="text-3xl md:text-4xl font-black text-white tracking-tighter uppercase text-left flex-1">Your Vault</h2></div>
                 
                 <div className="flex flex-wrap gap-2 mb-6">
                   {['Newest', 'Oldest', 'A-Z', 'Z-A'].map(mode => (
                     <button key={mode} onClick={() => setVaultSortMode(mode)} className={`px-5 py-2 rounded-full text-[10px] uppercase tracking-widest font-black transition-all border ${vaultSortMode === mode ? 'bg-white text-black' : 'bg-transparent border-white/10 text-gray-500'}`}>{mode}</button>
                   ))}
                 </div>

                 <div className="flex flex-col gap-2">
                   {sortedVault.map((item) => (
                      <VaultItem 
                        key={item.word} 
                        item={item} 
                        onDetails={(w) => { setSummaryActiveWord(w); fetchDictionaryData(w); }} 
                        onToggle={toggleVaultWord} 
                      />
                   ))}
                   {vault.length === 0 && <p className="text-gray-600 text-center py-20 font-black uppercase tracking-widest">Vault is empty</p>}
                 </div>
               </div>
               {summaryActiveWord && <DictionaryModal word={summaryActiveWord} dictData={dictData} isLoading={isLoadingDict} onClose={() => setSummaryActiveWord(null)} isVaultMode={true} />}
            </div>
          )}

          <div className="fixed bottom-6 left-0 w-full flex justify-center px-6 z-40 pointer-events-none landscape:bottom-4">
            {appState === 'idle' && (<button className="pointer-events-auto w-full max-w-md py-5 rounded-2xl text-sm font-black tracking-widest uppercase bg-white text-black shadow-lg transition-all active:scale-95" onClick={startSession}>Start Session</button>)}
            {appState === 'active' && (<button className="pointer-events-auto py-3 px-8 rounded-full text-[10px] font-black tracking-widest uppercase bg-[#0f0f0f] border border-white/10 text-gray-400 active:scale-95" onClick={stopSession}>End Session</button>)}
            {(appState === 'summary' || appState === 'vault') && (<button className="pointer-events-auto w-full max-w-md py-5 rounded-2xl text-sm font-black tracking-widest uppercase bg-[#151515] border border-white/10 active:scale-95 transition-all" onClick={resetToIdle}>New Session</button>)}
          </div>
          <div className="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#050505] to-transparent pointer-events-none z-30 landscape:h-20" />
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
